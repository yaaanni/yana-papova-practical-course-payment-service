spring:
  liquibase:
    enabled: true
    change-log: classpath:db/master.yml
  application:
    name: payment-service

  mongodb:
    uri: ${MONGO_URL}

  kafka:
    bootstrap-servers: kafka:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  external:
    payment-service:
      url: ${EXTERNAL_PAYMENT_SERVICE_URL}

management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: "http://alloy:4318/v1/traces"
  otlp:
    metrics:
      export:
        enabled: false
        url: "http://alloy:4318/v1/metrics"